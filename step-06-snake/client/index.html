<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Step 6: 蛇ゲーム</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #1a1a2e; color: white; }
    h1 { color: #eee; }
    #info { display: flex; gap: 20px; margin-bottom: 12px; font-size: 14px; color: #aaa; flex-wrap: wrap; }
    #status { padding: 6px 12px; border-radius: 4px; font-weight: bold; }
    .connected    { background: #155724; }
    .disconnected { background: #721c24; }
    canvas { border: 2px solid #444; display: block; }
    .controls { margin-bottom: 12px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    #btnConnect    { background: #007bff; color: white; }
    #btnDisconnect { background: #dc3545; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: #888; font-size: 13px; margin-top: 8px; }
    #scoreboard { font-size: 13px; color: #aaa; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Step 6: 蛇ゲーム</h1>

  <div class="controls">
    <button id="btnConnect">接続</button>
    <button id="btnDisconnect" disabled>切断</button>
  </div>

  <div id="info">
    <span id="status" class="disconnected">切断中</span>
    <span>自分: <span id="myId">なし</span></span>
    <span>スコア: <span id="myScore">0</span></span>
    <span>プレイヤー数: <span id="playerCount">0</span></span>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <p class="hint">矢印キーで方向転換（180度転換は禁止） / 複数タブで接続してみてください</p>
  <div id="scoreboard"></div>

  <script>
    const GRID = 20; // グリッドサイズ（px）

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');

    let ws    = null;
    let myId  = null;
    let state = { snakes: {}, foods: [] };

    const statusEl      = document.getElementById('status');
    const myIdEl        = document.getElementById('myId');
    const myScoreEl     = document.getElementById('myScore');
    const playerCountEl = document.getElementById('playerCount');
    const scoreboardEl  = document.getElementById('scoreboard');
    const btnConn       = document.getElementById('btnConnect');
    const btnDisc       = document.getElementById('btnDisconnect');

    function setUI(connected) {
      statusEl.textContent = connected ? '接続中' : '切断中';
      statusEl.className   = connected ? 'connected' : 'disconnected';
      btnConn.disabled     = connected;
      btnDisc.disabled     = !connected;
    }

    btnConn.addEventListener('click', () => {
      ws = new WebSocket('ws://localhost:8080/ws');

      ws.onopen = () => setUI(true);

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.myId) {
          myId = msg.myId;
          myIdEl.textContent = myId;
        }

        if (msg.type === 'state') {
          state = msg;

          // スコア更新
          const mySnake = state.snakes && state.snakes[myId];
          if (mySnake) {
            myScoreEl.textContent = mySnake.score;
          }

          // プレイヤー数更新
          playerCountEl.textContent = Object.keys(state.snakes || {}).length;

          draw();
          updateScoreboard();
        }
      };

      ws.onclose = () => {
        setUI(false);
        myId = null;
        myIdEl.textContent = 'なし';
        state = { snakes: {}, foods: [] };
        draw();
        ws = null;
      };

      ws.onerror = () => console.error('WebSocket エラー');
    });

    btnDisc.addEventListener('click', () => { if (ws) ws.close(); });

    // キー入力
    document.addEventListener('keydown', (e) => {
      let direction = null;
      switch (e.key) {
        case 'ArrowUp':    direction = 'up';    break;
        case 'ArrowDown':  direction = 'down';  break;
        case 'ArrowLeft':  direction = 'left';  break;
        case 'ArrowRight': direction = 'right'; break;
        default: return;
      }
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'input', direction }));
    });

    // スコアボード更新
    function updateScoreboard() {
      if (!state.snakes) return;
      const sorted = Object.values(state.snakes)
        .sort((a, b) => b.score - a.score);
      scoreboardEl.innerHTML = '🏆 スコアボード: ' +
        sorted.map(s =>
          `<span style="color:${s.color}">${s.id === myId ? '★' : ''}${s.id}: ${s.score}</span>`
        ).join(' / ');
    }

    // 描画
    function draw() {
      // 背景
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // グリッド線
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += GRID) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += GRID) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // エサを描画
      if (state.foods) {
        for (const food of state.foods) {
          ctx.fillStyle = '#ffdd57';
          ctx.beginPath();
          ctx.arc(food.x + GRID/2, food.y + GRID/2, GRID/2 - 3, 0, Math.PI * 2);
          ctx.fill();
          // キラキラ感
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.arc(food.x + GRID/2 - 3, food.y + GRID/2 - 3, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 蛇を描画
      if (state.snakes) {
        for (const [id, snake] of Object.entries(state.snakes)) {
          drawSnake(snake, id === myId);
        }
      }
    }

    function drawSnake(snake, isMe) {
      if (!snake.body || snake.body.length === 0) return;

      for (let i = 0; i < snake.body.length; i++) {
        const seg = snake.body[i];
        const isHead = i === 0;

        // 頭は明るく、体は少し暗く
        if (isHead) {
          ctx.fillStyle = snake.color;
        } else {
          // 徐々に暗くなる効果
          ctx.fillStyle = darkenColor(snake.color, Math.min(i * 3, 60));
        }

        ctx.fillRect(seg.x + 1, seg.y + 1, GRID - 2, GRID - 2);

        // 頭の場合は目を描く
        if (isHead) {
          drawEyes(seg.x, seg.y, snake.direction);
        }
      }

      // 自分の蛇は枠線
      if (isMe && snake.body.length > 0) {
        const head = snake.body[0];
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(head.x + 1, head.y + 1, GRID - 2, GRID - 2);
      }
    }

    // 目を描く
    function drawEyes(x, y, direction) {
      ctx.fillStyle = 'white';
      const eyeSize = 3;
      let e1, e2;

      switch (direction) {
        case 'right':
          e1 = { x: x + GRID - 5, y: y + 5 };
          e2 = { x: x + GRID - 5, y: y + GRID - 7 };
          break;
        case 'left':
          e1 = { x: x + 3, y: y + 5 };
          e2 = { x: x + 3, y: y + GRID - 7 };
          break;
        case 'up':
          e1 = { x: x + 5, y: y + 3 };
          e2 = { x: x + GRID - 7, y: y + 3 };
          break;
        case 'down':
          e1 = { x: x + 5, y: y + GRID - 5 };
          e2 = { x: x + GRID - 7, y: y + GRID - 5 };
          break;
        default:
          return;
      }

      ctx.beginPath();
      ctx.arc(e1.x, e1.y, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e2.x, e2.y, eyeSize, 0, Math.PI * 2);
      ctx.fill();
    }

    // 色を暗くする（簡易版）
    function darkenColor(hex, amount) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.max(0, r - amount)}, ${Math.max(0, g - amount)}, ${Math.max(0, b - amount)})`;
    }

    draw(); // 初期描画
  </script>
</body>
</html>
